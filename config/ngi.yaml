# =============================================================================
# Northgate Industrial (NGI) – synthetic ITSM data configuration
# FICTIONAL client. ALL data generated. No real company or personal data.
# Rationale for every value: docs/design.md (decisions D1–D8)
# =============================================================================

meta:
  client_name: Northgate Industrial
  client_code: NGI
  seed: 20260927                    # same seed + same config = identical dataset
  load_tag_prefix: NGI-SYNTH-       # written to correlation_id; enables rollback
  generator_user: ngi.synth.loader  # sys_created_by / sys_updated_by on history
  servicenow_release: "Brazil Patch 0 (glide-brazil-08-25-2026__patch0-08-26-2026)"

# --- D2 time window / D8 time zone ------------------------------------------
time:
  start_date: 2025-07-01
  end_date: today                   # resolved at run time (load date)
  local_timezone: Europe/Paris      # generator reasons in local time, outputs UTC
  autoclose_days: 7                 # glide.ui.autoclose.time (T2)
  trickle:                          # daily job keeps trends alive after load
    enabled: true
    run_daily_at_local: "02:00"

# --- D3 organisation --------------------------------------------------------
organisation:
  employees: 3500
  sites:                            # all sites share the CET/CEST offset
    - {code: LYO, name: Lyon,      country: FR, role: HQ,    employee_share: 0.30}
    - {code: HAM, name: Hamburg,   country: DE, role: plant, employee_share: 0.18}
    - {code: MIL, name: Milan,     country: IT, role: plant, employee_share: 0.15}
    - {code: KAT, name: Katowice,  country: PL, role: plant, employee_share: 0.15}
    - {code: ROT, name: Rotterdam, country: NL, role: plant, employee_share: 0.12}
    - {code: VLC, name: Valencia,  country: ES, role: plant, employee_share: 0.10}

  departments:                      # share of employees per department (all sites)
    Production: 0.38
    Maintenance: 0.12
    Quality: 0.07
    Logistics: 0.10
    Engineering: 0.09
    Sales: 0.07
    Finance: 0.05
    Procurement: 0.05
    HR: 0.03
    IT: 0.04                        # agents are drawn from IT staff
  agent_department: IT
  email_domain: northgate-industrial.example   # reserved .example TLD – never a real mailbox

  # "NGI" prefix avoids clashes with PDI demo groups: file 23 shows "Service Desk",
  # "Network", "Database", "Hardware", "Software", "Help Desk" already exist
  assignment_groups:
    - {name: "NGI Service Desk",                agents: 14, tier: 1, sites: [LYO]}
    - {name: "NGI Workplace Support - West",    agents: 6,  tier: 2, sites: [LYO, VLC]}
    - {name: "NGI Workplace Support - Central", agents: 6,  tier: 2, sites: [HAM, ROT]}
    - {name: "NGI Workplace Support - East",    agents: 6,  tier: 2, sites: [MIL, KAT]}
    - {name: "NGI Network Operations",          agents: 5,  tier: 2}
    - {name: "NGI Database Administration",     agents: 4,  tier: 3}
    - {name: "NGI SAP ERP Support",             agents: 6,  tier: 2}
    - {name: "NGI Plant OT Support",            agents: 5,  tier: 2}
    - {name: "NGI Identity and Access",         agents: 3,  tier: 2}
    - {name: "NGI Application Support",         agents: 5,  tier: 2}
    - {name: "NGI Infrastructure Engineering",  agents: 4,  tier: 3}
    - {name: "NGI Legacy Helpdesk (retired)",   agents: 0,  tier: 1, active: false}   # D6 defect source

# --- Incidents --------------------------------------------------------------
incidents:
  monthly_volume: 1400
  weekday_weights: [1.15, 1.10, 1.05, 1.05, 0.95, 0.40, 0.30]   # Mon..Sun
  business_hours_share: 0.88        # share opened Mon–Fri 08:00–18:00 local
  weekend_hours: ["07:00", "21:00"] # weekend / FR public holiday tickets fall in this window
  holiday_behaviour: saturday       # FR public holidays get the Saturday volume weight
  month_factors: {12: 0.85}         # late-December slowdown (August: story_events)

  priority_mix: {1: 0.01, 2: 0.07, 3: 0.52, 4: 0.40}
  # impact/urgency -> priority, standard ServiceNow matrix
  priority_matrix:
    "1,1": 1
    "1,2": 2
    "2,1": 2
    "1,3": 3
    "2,2": 3
    "3,1": 3
    "2,3": 4
    "3,2": 4
    "3,3": 5

  category_mix: {inquiry: 0.22, software: 0.30, hardware: 0.18, network: 0.10, database: 0.05, password_reset: 0.15}
  software_subcategory_weights: {os: 0.25, email: 0.25, erp: 0.35, mes: 0.15}   # erp/mes need D9

  # Routing when the Service Desk escalates (weights per category)
  escalation_routing:
    inquiry:        {"NGI Application Support": 1.0}
    software:       {"NGI Application Support": 0.55, "NGI SAP ERP Support": 0.45}
    hardware:       {"NGI Workplace Support - <region>": 0.80, "NGI Plant OT Support": 0.20}
    network:        {"NGI Network Operations": 0.85, "NGI Plant OT Support": 0.15}
    database:       {"NGI Database Administration": 1.0}
    password_reset: {"NGI Identity and Access": 1.0}

  first_contact_resolution_rate: 0.60   # resolved by Service Desk, reassignment_count = 0
  fcr_category_weights:             # relative chance of first-contact resolution per category
    password_reset: 1.5
    inquiry: 1.3
    software: 0.9
    hardware: 0.7
    network: 0.6
    database: 0.3
  p1_fcr_factor: 0.2                # P1s rarely stay with the Service Desk
  subcategory_routing: {erp: "NGI SAP ERP Support", mes: "NGI Plant OT Support"}
  routing_fallback: hardware        # routing used for missing / legacy categories
  reassignments_when_escalated: {1: 0.70, 2: 0.22, 3: 0.08}

  close_code_mix:                   # values exactly as on the instance (file 16)
    "Solution provided": 0.60
    "Workaround provided": 0.12
    "Resolved by caller": 0.08
    "User error": 0.07
    "Known error": 0.04
    "Resolved by change": 0.03
    "Resolved by problem": 0.02
    "Resolved by request": 0.02
    "Duplicate": 0.02
    "No resolution provided": 0.00
  hold_reason_mix:                  # hold_reason values (file 19)
    "1": 0.45                       # Awaiting Caller
    "4": 0.25                       # Awaiting Vendor
    "5": 0.10                       # Awaiting Change
    "2": 0.10                       # Awaiting Evidence
    "3": 0.10                       # Awaiting Problem

  # Lognormal durations in the SLA clock of each priority:
  # P1 = calendar time (24x7); P2–P4 = NGI business hours
  response_time_minutes:
    1: {median: 6,   sigma: 0.7}    # target 15 min
    2: {median: 25,  sigma: 0.8}    # target 60 min
    3: {median: 70,  sigma: 0.9}    # target 240 min
    4: {median: 150, sigma: 0.9}    # target 480 min
  resolution_time_hours:
    1: {median: 2.0, sigma: 0.6}    # target 4 h
    2: {median: 4.0, sigma: 0.8}    # target 8 business h
    3: {median: 5.0, sigma: 0.9}    # target 10 business h
    4: {median: 9.0, sigma: 0.9}    # target 20 business h

  on_hold: {rate: 0.08, median_hours: 16, sigma: 0.8}
  reopen_rate: 0.04
  reopen: {gap_days: [1, 3], extra_business_hours: {median: 4, sigma: 0.8}}
  cancel_rate: 0.02
  cancel_after_hours: {median: 3, sigma: 1.0}
  long_running_share: 0.015         # vendor-wait tail, resolved after 30–90 days
  long_running_days: [30, 90]
  stale_open_share: 0.10            # open incidents with no update for > 5 days

# --- Changes ----------------------------------------------------------------
changes:
  monthly_volume: 180
  type_mix: {standard: 0.55, normal: 0.40, emergency: 0.05}
  close_code_mix:
    standard:  {successful: 0.97, successful_issues: 0.02, unsuccessful: 0.01}
    normal:    {successful: 0.88, successful_issues: 0.08, unsuccessful: 0.04}
    emergency: {successful: 0.78, successful_issues: 0.12, unsuccessful: 0.10}
  lead_time_days: {standard: 2, normal: 10, emergency: 0}
  duration_hours: {median: 2.0, sigma: 0.7}
  implementation_window: {weekday_evening: "18:00-22:00", weekend_share: 0.35}
  implementing_groups:
    - "NGI Infrastructure Engineering"
    - "NGI Network Operations"
    - "NGI Database Administration"
    - "NGI SAP ERP Support"
    - "NGI Application Support"
    - "NGI Plant OT Support"
  cancel_rate: 0.03
  review_days: {standard: 0, normal: 2, emergency: 1}   # Review state before closure
  assess_days_normal: 3             # recently opened normal changes still in Assess
  scheduled_horizon_days: 14        # changes already planned beyond the load date
  induced_incidents:                # incident.caused_by -> change
    probability_if_unsuccessful: 0.30
    incidents_per_event: [1, 4]
    window_hours: 48
    priority_mix: {1: 0.05, 2: 0.25, 3: 0.50, 4: 0.20}
    category_by_group:
      "NGI Infrastructure Engineering": {category: hardware}
      "NGI Network Operations": {category: network}
      "NGI Database Administration": {category: database}
      "NGI SAP ERP Support": {category: software, subcategory: erp}
      "NGI Application Support": {category: software}
      "NGI Plant OT Support": {category: software, subcategory: mes}

# --- D4 SLAs ----------------------------------------------------------------
sla:
  schedule:
    name: "NGI Business Hours - Europe/Paris"
    days: [mon, tue, wed, thu, fri]
    start: "08:00"
    end: "18:00"
    timezone: Europe/Paris
    holidays: FR
  definitions:                      # durations in minutes; "business days" written as hours
    - {name: "NGI P1 response (15 min)",     priority: 1, target: response,   minutes: 15,   clock: 24x7}
    - {name: "NGI P1 resolution (4 h)",      priority: 1, target: resolution, minutes: 240,  clock: 24x7}
    - {name: "NGI P2 response (1 h)",        priority: 2, target: response,   minutes: 60,   clock: business}
    - {name: "NGI P2 resolution (8 bh)",     priority: 2, target: resolution, minutes: 480,  clock: business}
    - {name: "NGI P3 response (4 bh)",       priority: 3, target: response,   minutes: 240,  clock: business}
    - {name: "NGI P3 resolution (10 bh)",    priority: 3, target: resolution, minutes: 600,  clock: business}
    - {name: "NGI P4 response (8 bh)",       priority: 4, target: response,   minutes: 480,  clock: business}
    - {name: "NGI P4 resolution (20 bh)",    priority: 4, target: resolution, minutes: 1200, clock: business}

# --- D6 deliberate data-quality defects (switchable) ------------------------
data_quality_defects:
  enabled: true
  missing_category_rate: 0.015
  legacy_category:
    value: pc_issue                 # retired value, not in the active choice list
    rate: 0.03
    only_before: 2026-01-01
  retired_group:
    name: "NGI Legacy Helpdesk (retired)"
    rate: 0.01
    only_before: 2025-11-01

# --- D7 story events --------------------------------------------------------
story_events:
  august_dip:
    month: 8
    volume_factor: 0.70
  erp_failed_change:
    change_start_local: "2026-03-07 22:00"   # Saturday maintenance window
    duration_hours: 6
    short_description: "SAP S/4HANA support package upgrade - weekend maintenance"
    change_type: normal
    close_code: unsuccessful
    implementing_group: "NGI SAP ERP Support"
    extra_incidents: 220
    spread_days: 5                            # Mon 9 – Fri 13 March
    first_day_local: 2026-03-09
    daily_profile: [0.35, 0.25, 0.18, 0.12, 0.10]   # wave decays over the week
    category: software
    priority_mix: {1: 0.05, 2: 0.35, 3: 0.60}
  governance_improvement:
    start: 2026-01-01
    ramp_months: 6
    resolution_time_factor_at_end: 0.75       # MTTR -25 % by July 2026
    fcr_rate_at_end: 0.68

# --- Output -----------------------------------------------------------------
output:
  batch_size: 200
  directory: output/
  ground_truth: true                # CSV exports + expected KPI values for validation

# =============================================================================
# INSTANCE FACTS – values read from the PDI (T2, T7, T8.1).
# Items marked CONFIRM / FILL are completed from T8.1 files 16–23.
# =============================================================================
instance_facts:
  incident_categories: [inquiry, software, hardware, network, database, password_reset]   # T2 + T4b
  incident_states: {new: 1, in_progress: 2, on_hold: 3, resolved: 6, closed: 7, canceled: 8}   # file 17
  incident_close_codes:             # file 16 – note: values contain capitals and spaces
    - "Duplicate"
    - "Known error"
    - "No resolution provided"
    - "Resolved by caller"
    - "Resolved by change"
    - "Resolved by problem"
    - "Resolved by request"
    - "Solution provided"
    - "Workaround provided"
    - "User error"
  incident_hold_reasons: {"1": Awaiting Caller, "2": Awaiting Evidence, "3": Awaiting Problem, "4": Awaiting Vendor, "5": Awaiting Change}   # file 19
  incident_subcategories:           # file 18 – values contain spaces; password_reset has none
    database: [oracle, "sql server", db2]
    hardware: [cpu, keyboard, memory, mouse, disk, monitor]
    inquiry: [email, "internal application", antivirus]
    network: [dhcp, "ip address", dns, vpn, wireless]
    software: [os, email]
    password_reset: []
  change_states: {new: -5, assess: -4, authorize: -3, scheduled: -2, implement: -1, review: 0, closed: 3, canceled: 4}   # file 20
  change_types: [standard, normal, emergency, model]   # file 20 – "model" exists on Brazil, not used
  change_close_codes: [successful, successful_issues, unsuccessful]   # T2
  task_sla_stages: {in_progress: in_progress, paused: paused, completed: completed, cancelled: cancelled}   # file 25
  # file 25 also lists "achieved" and "breached": not used (breach is carried by has_breached).
  # Verified against a live engine-created SLA in T9.
  task_sla_fields: [active, business_duration, business_pause_duration, business_percentage, business_time_left,
                    duration, end_time, has_breached, original_breach_time, pause_duration, pause_time, percentage,
                    planned_end_time, schedule, sla, stage, start_time, sys_created_by, sys_created_on, sys_id,
                    sys_mod_count, sys_updated_by, sys_updated_on, task, timezone, time_left]   # file 24
  mandatory_when_resolved:          # files 21–22: only one active data policy with mandatory rules
    incident: [close_code, close_notes]
    change_request: []

# D9 – NGI additions to the incident subcategory choice list (configuration, update set NGI-P0-02)
ngi_choice_additions:
  incident_subcategory:
    - {value: erp, label: "ERP / SAP",        dependent_value: software}
    - {value: mes, label: "MES / Shop floor", dependent_value: software}
