[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-synthetic-itsm-data"
version = "0.1.0"
description = "Synthetic, backdated ServiceNow ITSM data generator (fictional client Northgate Industrial)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyyaml", "holidays", "requests"]

[tool.setuptools.packages.find]
where = ["generator"]
